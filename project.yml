name: VoiceBrowser
options:
  bundleIdPrefix: com.voicebrowser
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  VoiceBrowser:
    type: application
    platform: iOS
    sources:
      - VoiceBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voicebrowser.app
        INFOPLIST_FILE: VoiceBrowser/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: ""
