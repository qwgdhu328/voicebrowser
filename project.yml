name: VoiceBrowser
options:
  bundleIdPrefix: com.voicebrowser
  deploymentTarget:
    iOS: "17.0"
settings:
  SWIFT_VERSION: "5.9"
targets:
  VoiceBrowser:
    type: application
    platform: iOS
    sources:
      - path: VoiceBrowser
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.voicebrowser.app
      INFOPLIST_FILE: VoiceBrowser/Info.plist
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO