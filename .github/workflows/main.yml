name: Build and Archive VoiceBrowser

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - sdk: iphonesimulator
            output: VoiceBrowser.app

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for ${{ matrix.config.sdk }}
        run: |
          xcodebuild -project VoiceBrowser.xcodeproj \
            -scheme VoiceBrowser \
            -sdk ${{ matrix.config.sdk }} \
            -arch arm64 \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log

      - name: Prepare artifacts
        run: |
          mkdir -p /tmp/artifacts
          ditto build/Release-iphonesimulator/VoiceBrowser.app /tmp/artifacts/VoiceBrowser.app
          cp build.log /tmp/artifacts/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.output }}
          path: /tmp/artifacts/
          if-no-files-found: warn
